[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
chrono = { version = "0.4.43", features = ["serde"] }
diesel = { version = "2.3.6", features = ["chrono", "postgres", "r2d2", "serde_json", "uuid"] }
diesel_migrations = { version = "2.3.1", features = ["postgres"] }
dotenvy = "0.15.7"
env_logger = "0.11.9"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
lazy_static = "1.5.0"
log = "0.4.29"
r2d2 = "0.8.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
ntex = { version = "3.7.0", features = ["tokio", "openssl"] }
ntex-net = { version = "3.8.0", features = ["tokio"] }
ntex-mqtt = "7.6.1"
openssl = "0.10"
postcard = { git = "https://github.com/jamesmunns/postcard.git", rev = "de182557cff45f2ca9b2b67a6b93be5917612a44", features = ["use-std"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }
common-types = { git = "https://github.com/juancabe/tfg-common-types", default-features = false }
bcrypt = "0.19.0"
